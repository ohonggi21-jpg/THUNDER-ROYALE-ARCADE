<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THUNDER ROYALE CASINO</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4ecd8;--cd:#fffaf0;--tx:#2a1a10;--mu:#7b6b58;--gd:#8a5f00;--ac:#8b1a2b;--ok:#16794c;--ln:#dccba2;--fe:#15694a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0812;--cd:#181022;--tx:#f3e9d2;--mu:#a99bb5;--gd:#e6c15a;--ac:#e0475b;--ok:#4cd68f;--ln:#3a2d4d;--fe:#0f4a34}}
:root[data-theme="dark"]{--bg:#0c0812;--cd:#181022;--tx:#f3e9d2;--mu:#a99bb5;--gd:#e6c15a;--ac:#e0475b;--ok:#4cd68f;--ln:#3a2d4d;--fe:#0f4a34}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:14px 16px 40px}
.hero{text-align:center;padding:18px 0 8px;user-select:none}
h1{font:800 44px/1 Cinzel,Georgia,serif;margin:6px 0;letter-spacing:3px;color:var(--gd)}
h2{font:700 20px Cinzel,Georgia,serif;margin:4px 0 10px;color:var(--gd)}
.casino{font:600 20px Cinzel,serif;letter-spacing:12px;color:var(--ac)}
.sub{font-size:11px;letter-spacing:2px;color:var(--mu);text-transform:uppercase;margin:4px 0}
.mut{color:var(--mu);font-size:13px;margin:6px 0}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:12px 0}
.c{text-align:center}.big{font:700 24px Cinzel,serif}.huge{font:800 64px Cinzel,serif;color:var(--gd)}
.ok{color:var(--ok);font-weight:700}.new{color:var(--ac);font-weight:800;margin:6px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;margin:8px 0;font:700 16px system-ui;color:#2a1a00;background:linear-gradient(135deg,#f6dc8a,#c9981c);cursor:pointer}
.btn.alt{background:transparent;color:var(--gd);border:1.5px solid var(--gd)}
.btn:active{transform:scale(.98)}
.lk{background:none;border:0;color:var(--mu);cursor:pointer;font-size:13px;padding:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:16px;margin:6px 0}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu)}
.rw{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid var(--ln)}
.rw.me{background:color-mix(in srgb,var(--gd) 14%,transparent);border-radius:8px}
.rk{width:30px;font-size:20px;text-align:center}.nm{flex:1;font-weight:700}.nm small{display:block;font-weight:400;color:var(--mu);font-size:11px}
.rw b{font:800 22px Cinzel,serif;color:var(--gd)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;color:var(--tx);font:600 12px Cinzel,serif}
.gc span{display:block;font-size:34px}.gc small{display:block;color:var(--mu);font:12px system-ui;margin-top:4px}
.felt{background:radial-gradient(circle,var(--fe),#06261b);border-radius:14px;padding:14px;color:#f3e9d2;text-align:center;min-height:240px}
.felt .sub{color:#cdbf9c}.felt .mut{color:#cdbf9c}
.wheel{width:110px;height:110px;border-radius:50%;margin:6px auto 12px;display:grid;place-items:center;font:800 42px Cinzel,serif;border:5px solid #d4af37;background:#222;color:#fff}
.wheel.r{background:#b3182b}.wheel.b{background:#111}.wheel.g{background:#0d7a3e}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.opt{padding:10px 4px;border-radius:10px;border:1.5px solid #d4af37;background:transparent;color:#f3e9d2;font-size:14px;cursor:pointer}
.opt small{display:block;font-size:11px;color:#d4af37}.opt.on{background:#d4af37;color:#2a1a00}.opt.on small{color:#2a1a00}
.hid{display:none}
.reels{display:flex;gap:8px;justify-content:center;margin:14px 0}
.reel{width:84px;height:100px;background:#fff;border-radius:12px;display:grid;place-items:center;font-size:48px;border:3px solid #d4af37}
.reel.hit{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.12)}}
.dz{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.die{font-size:54px;letter-spacing:4px;color:#fff;min-height:72px}
.dz .glow{text-shadow:0 0 18px #ffd34d;animation:pop .5s 2}
.hand{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.cd{width:52px;height:74px;border-radius:8px;background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 20px system-ui;box-shadow:0 2px 6px #0006;transition:transform .15s}
.cd b{font-size:22px}.cd.red{color:#c4162a}.cd.sel{transform:translateY(-12px);outline:3px solid #ffd34d}
.cd.back{background:repeating-linear-gradient(45deg,#8b1a2b,#8b1a2b 6px,#5e0f1c 6px,#5e0f1c 12px);color:#ffd34d}
.bars{display:grid;gap:6px;margin-top:8px}.br{display:flex;align-items:center;gap:8px;font-size:12px}.br i{flex:1;height:8px;background:var(--ln);border-radius:4px;overflow:hidden}.br i u{display:block;height:100%;background:linear-gradient(90deg,#c9981c,#f6dc8a)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.bd{font-size:12px;padding:5px 9px;border-radius:20px;border:1px solid var(--ln);color:var(--mu)}.bd.on{border-color:var(--gd);color:var(--gd);font-weight:700}
.foot{text-align:center;font-size:11px;color:var(--mu);margin-top:16px}
.cf{position:fixed;top:-10px;width:9px;height:14px;z-index:99;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(720deg);opacity:.2}}
.shake{animation:shk .45s}@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.ban{position:fixed;inset:0;display:grid;place-items:center;z-index:98;pointer-events:none;font:800 40px Cinzel,serif;color:#ffd34d;text-shadow:0 0 24px #ffb300,0 2px 0 #7a4b00;animation:ban 1.4s forwards}
@keyframes ban{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.15);opacity:1}80%{opacity:1}100%{transform:scale(1);opacity:0}}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.tb{padding:6px 10px;border-radius:16px;border:1px solid var(--ln);background:none;color:var(--mu);white-space:nowrap;cursor:pointer;font-size:12px}.tb.on{border-color:var(--gd);color:var(--gd);font-weight:700}
/* SLOT UI */
.smo{position:fixed;inset:0;z-index:90;background:radial-gradient(circle at 50% 20%,#3a0a1f,#0b0710 70%);display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));overflow:auto;animation:fin .35s}
.smo.fs{background:radial-gradient(circle at 50% 20%,#4b0a7a,#07041a 70%)}
@keyframes fin{from{opacity:0;transform:scale(.94)}}
.smc{width:100%;max-width:420px;text-align:center;color:#f3e9d2}
.smb{font:800 20px Cinzel,serif;letter-spacing:3px;color:#ffd34d;text-shadow:0 0 14px #ffb300;margin-bottom:10px}
.smo.fs .smb{color:#ff7bff;text-shadow:0 0 16px #d400ff;animation:pls 1s infinite}
@keyframes pls{50%{transform:scale(1.06)}}
.mach{padding:10px;border-radius:20px;background:linear-gradient(145deg,#ffe58a,#a8741a 45%,#ffe58a);box-shadow:0 0 30px #ffb30088,inset 0 0 8px #fff8}
.smo.fs .mach{box-shadow:0 0 34px #d400ffaa,inset 0 0 8px #fff8}
.reels2{display:flex;gap:8px;padding:10px;border-radius:14px;background:linear-gradient(#0a0610,#241030 50%,#0a0610)}
.rl{flex:1;height:112px;display:grid;place-items:center;font-size:64px;border-radius:10px;background:linear-gradient(#fff,#efe3c5 50%,#fff);box-shadow:inset 0 0 14px #0007}
.rl.spin{filter:blur(2.5px);animation:jit .09s infinite;box-shadow:inset 0 0 14px #0007,0 0 14px #ffd34d}
@keyframes jit{50%{transform:translateY(5px)}}
.rl.stop{animation:thk .35s}
@keyframes thk{0%{transform:translateY(-14px)}60%{transform:translateY(4px)}}
.rl.win{animation:wn .6s infinite alternate;box-shadow:0 0 22px #ffd34d,inset 0 0 14px #ffd34d88;z-index:1}
@keyframes wn{to{transform:scale(1.1)}}
.smi{min-height:26px;margin:10px 0 2px;font-weight:700;color:#ffe58a}
.smt{font:800 26px Cinzel,serif;color:#fff;margin-bottom:8px}.smt b{color:#ffd34d}
.pt{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:12px;font-size:12px}
.pr{display:flex;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:8px;background:#ffffff14;border:1px solid #ffd34d44}.pr b{color:#ffd34d}
.champPts{font:800 22px Cinzel,serif;color:var(--gd);white-space:nowrap}.pos{font-size:11px;color:var(--mu);font-weight:500}.ruleline{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;border-bottom:1px solid var(--ln);font-size:13px}.ruleline:last-child{border-bottom:0}.positive{color:var(--ok);font-weight:800}.negative{color:var(--ac);font-weight:800}.champTop{border:1px solid var(--gd);background:color-mix(in srgb,var(--gd) 10%,var(--cd));border-radius:14px;padding:13px;margin:12px 0;text-align:center}.champTop .name{font:800 22px Cinzel,serif;color:var(--gd)}.tinybtn{padding:7px 12px;border:1px solid var(--gd);border-radius:18px;background:transparent;color:var(--gd);font-weight:700;cursor:pointer;font-size:12px}
</style></head><body><div id="app"></div>
<script>
const G=[{id:'roulette',n:'ROYAL ROULETTE',ic:'🎡'},{id:'slot',n:'GOLDEN JACKPOT',ic:'🎰'},{id:'bj',n:'BLACKJACK 21',ic:'🃏'},{id:'dice',n:'DICE DUEL',ic:'🎲'},{id:'hl',n:'HIGH & LOW',ic:'⬆️'},{id:'poker',n:'ROYAL POKER',ic:'♠️'}];
const TT=[[600,'THUNDER GOD'],[500,'LEGEND'],[400,'ROYAL'],[300,'ACE'],[200,'HIGH ROLLER'],[100,'PLAYER'],[0,'ROOKIE']];
const PIN='7777',$=s=>document.querySelector(s),A=$('#app');
let view='menu',mode='free',gid='',tour=null,g={},P={},db=null,me='',snd=true,taps=0,au=0,cf=0,M={n:1,hof:[],history:[]},dq=null,rkf='all',champMore=false;
try{me=localStorage.getItem('trc_me')||''}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pid=n=>[...n.trim().toLowerCase()].map(c=>c.codePointAt(0).toString(36)).join('_');
const total=p=>G.reduce((s,x)=>s+((p&&p.s&&p.s[x.id])||0),0);
const played=p=>G.filter(x=>p&&p.s&&p.s[x.id]!=null).length;
const title=t=>TT.find(x=>t>=x[0])[1];
const sorted=()=>Object.values(P).filter(p=>p&&(p.dw||0)>0).sort((a,b)=>(b.dw||0)-(a.dw||0)||(a.t||0)-(b.t||0));
const champSorted=()=>Object.values(P).filter(p=>p&&(p.cm||0)>0).sort((a,b)=>(Number(b.cp)||0)-(Number(a.cp)||0)||(Number(b.cw)||0)-(Number(a.cw)||0)||String(a.name||'').localeCompare(String(b.name||''),'ko'));
const pointText=n=>(Number(n)>0?'+':'')+String(Number(n)||0);
const lsLoad=()=>{try{return JSON.parse(localStorage.getItem('trc_players'))||{}}catch(e){return{}}};
const lsSave=()=>{try{localStorage.setItem('trc_players',JSON.stringify(P))}catch(e){}};
let ac;function bp(f=440,d=.08,t='sine'){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),v=ac.createGain();o.type=t;o.frequency.value=f;v.gain.value=.05;o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const fan=w=>{(w?[523,659,784,1047]:[330,262]).forEach((f,i)=>setTimeout(()=>bp(f,.18,'triangle'),i*130))};
const go=v=>{view=v;render()};
function render(){if(!me&&!['menu','loc','tv','champ'].includes(view))view='menu';({menu:vMenu,sel:vSel,game:vGame,res:vRes,fin:vFin,rank:vRank,prof:vProf,adm:vAdm,duel:vDuel,loc:vLoc,tv:vTv,champ:vChamp})[view]()}
const bar=()=>{const p=P[pid(me)];return `<div class=bar><button class=lk onclick="go('menu')">← MENU</button><span>${esc(me)} · ${dtitle((p&&p.dw)||0)}</span></div>`};
function board(n){const sc=p=>p.dw||0,l=sorted().slice(0,n);return `<div class=card><div class=sub>ROYAL LEADERBOARD</div>`+(l.length?l.map((p,i)=>`<div class="rw${p.name==me?' me':''}"><span class=rk>${['🥇','🥈','🥉'][i]||i+1}</span><span class=nm>${esc(p.name)}${i==0?' 🏆':''}<small>⚔️ 대결 승리</small></span><b>${sc(p)}</b></div>`).join(''):'<div class=mut>아직 기록이 없어요. 첫 번째 주인공이 되어 보세요!</div>')+'</div>'}
function champBoard(n){const l=champSorted().slice(0,n);return `<div class=card><div class=sub>ROYAL CHAMPIONSHIP · SEASON ${M.n}</div>`+(l.length?l.map((p,i)=>`<div class="rw${p.name==me?' me':''}"><span class=rk>${['🥇','🥈','🥉'][i]||i+1}</span><span class=nm>${esc(p.name)}${i==0?' 🏆':''}<small>${p.cw||0}승 · ${p.cd||0}무 · ${p.cl||0}패</small></span><b class=champPts>${pointText(p.cp)}점</b></div>`).join(''):'<div class=mut>아직 대회 기록이 없어요. LOCAL DUEL에서 첫 경기를 시작해 보세요!</div>')+`<button class=lk onclick="go('champ')">전체 대회 랭킹 보기 →</button></div>`}
function vMenu(){const p=P[pid(me)],t=total(p);
A.innerHTML=`<div class=hero onclick="tap()"><div class=sub>THE HOUSE OF FORTUNE</div><h1>THUNDER<br>ROYALE</h1><div class=casino>CASINO</div><div class=mut>운을 시험하고, 기록을 세우고, 왕좌를 차지하라</div></div>`+
(me?`<div class=card><div class=sub>WELCOME</div><div class=big>${esc(me)}</div><div class=mut>${dtitle((p&&p.dw)||0)} · ⚔️ 대결 ${(p&&p.dw)||0}승</div></div><button class=btn onclick="go('duel')">⚔️ 2인 대결 시작</button><div class=two><button class="btn alt" onclick="go('rank')">랭킹</button><button class="btn alt" onclick="go('prof')">내 프로필</button></div><button class=lk onclick="renameUI()">✏️ 닉네임 바꾸기</button><button class=lk onclick="logout()">다른 닉네임으로 입장</button>`
:`<div class=card><div class=sub>PLAYER NAME</div><input id=nn maxlength=10 placeholder="닉네임 입력" onkeydown="if(event.key=='Enter')login()"><button class=btn onclick="login()">ENTER THE CASINO</button></div>`)+champBoard(5)+
`<div class=two><button class="btn alt" onclick="LD=null;go('loc')">👥 LOCAL DUEL</button><button class="btn alt" onclick="go('champ')">🏆 ROYAL CHAMPIONSHIP</button></div><button class=lk onclick="go('tv')">📺 전광판</button><div class=foot>${db?'🟢 온라인 실시간 랭킹':'🟡 이 기기 랭킹'} · <button class=lk onclick="sndT(this)">${snd?'🔊':'🔇'}</button><button class=lk onclick="bgToggle()">🎵 BGM ${bgOn?'ON':'OFF'}</button><br>게임 속 가상 점수일 뿐, 현금 거래는 없어요.</div>`}
function tap(){taps++;setTimeout(()=>taps=0,3000);if(taps>=5){taps=0;au=0;cf=0;view='adm';render()}}
function login(){const v=$('#nn').value.trim();if(!v)return;me=v;try{localStorage.setItem('trc_me',v)}catch(e){}render()}
function logout(){me='';try{localStorage.removeItem('trc_me')}catch(e){}render()}
function startTour(){mode='tour';tour={i:0,r:{}};gid=G[0].id;go('game')}
function startFree(id){mode=pr?'prac':'free';gid=id;go('game')}
function vSel(){const p=P[pid(me)];A.innerHTML=bar()+`<h2>${pr?'🎈 PRACTICE':'CHOOSE YOUR GAME'}</h2><div class=grid>${G.map(x=>`<button class=gc onclick="startFree('${x.id}')"><span>${x.ic}</span>${x.n}<small>최고 ${p&&p.s&&p.s[x.id]!=null?p.s[x.id]:'—'}점</small></button>`).join('')}</div>`}
function vGame(){const x=G.find(a=>a.id==gid);A.innerHTML=bar()+`<div class=card><div class=sub>${mode=='tour'?'TOURNAMENT '+(tour.i+1)+'/6':mode=='prac'?'PRACTICE · 기록 안 됨':'FREE PLAY'}</div><h2>${x.ic} ${x.n}</h2><div class=felt id=S></div></div>`;GM[gid]()}
async function save(sc,win){const id=pid(me);let p=P[id]||{name:me,s:{},wins:0,plays:0,pts:0,t:0};p={...p,s:{...p.s}};const old=total(p);
p.s[gid]=Math.max(p.s[gid]||0,sc);p.plays++;p.pts+=sc;if(win)p.wins++;if(total(p)>old||!p.t)p.t=Date.now();P[id]=p;
if(db){try{await db.collection('players').doc(id).set(p)}catch(e){lsSave()}}else lsSave()}
async function finish(sc,win,msg){const p=P[pid(me)],prev=p&&p.s?p.s[gid]:undefined;fan(win);fx(sc,win);if(mode!='prac')await save(sc,win);
g.res={sc,win,msg,best:Math.max(prev||0,sc),isNew:prev==null||sc>prev};if(mode=='tour')tour.r[gid]=sc;setTimeout(()=>go('res'),1400)}
function vRes(){const r=g.res,x=G.find(a=>a.id==gid);A.innerHTML=bar()+`<div class="card c"><div class=sub>${x.n}</div><div class=huge>+${r.sc}</div><div class="${r.win?'ok':'mut'}">${r.msg}</div>${mode=='prac'?'<div class=mut>🎈 연습 모드 — 기록에 반영되지 않아요</div>':r.isNew&&r.sc>0?'<div class=new>✨ NEW BEST!</div>':''}<div class=mut>이 게임 최고 ${r.best}점</div></div>`+
(mode=='tour'?`<button class=btn onclick="nextG()">${tour.i==5?'최종 결과 보기':'다음 게임 →'}</button>`:`<button class=btn onclick="go('game')">다시 하기</button><button class="btn alt" onclick="go('sel')">게임 선택</button><button class="btn alt" onclick="go('rank')">랭킹 보기</button>`)}
function nextG(){tour.i++;if(tour.i>5)return go('fin');gid=G[tour.i].id;go('game')}
function vFin(){const s=G.reduce((a,x)=>a+(tour.r[x.id]||0),0),p=P[pid(me)];A.innerHTML=bar()+`<div class="card c"><div class=sub>TOURNAMENT COMPLETE</div><div class=huge>${s}</div><div class=mut>/ 600점 · 랭킹 총점 ${total(p)} · ${title(total(p))}</div>${G.map(x=>`<div class=rw><span class=rk>${x.ic}</span><span class=nm>${x.n}</span><b>${tour.r[x.id]||0}</b></div>`).join('')}</div><button class=btn onclick="go('rank')">랭킹 보기</button><button class="btn alt" onclick="startTour()">토너먼트 다시 도전</button>`}
function vRank(){const l=sorted(),i=l.findIndex(p=>p.name==me);A.innerHTML=bar()+`<h2>RANKING · SEASON ${M.n}</h2>`+board(10,rkf)+(i>9?`<div class=mut>내 순위: ${i+1}위 (${l[i].dw}승)</div>`:'')+(l[0]?`<div class="card c">🏆 SEASON ${M.n} 1위 <b>${esc(l[0].name)}</b></div>`:'')+hof()}

function slotEval(f){const sc=f.filter(x=>x=='💰').length,rest=f.filter(x=>x!='🃏'),w=3-rest.length;

if(rest.every(x=>x==rest[0])&&TRI[rest[0]])return{pts:TRI[rest[0]],tag:rest[0]=='7️⃣'?'777!':'TRIPLE',sc,big:TRI[rest[0]]>=85};
if(rest.some((x,i)=>rest.indexOf(x)!=i)||w>=1)return{pts:50,tag:'PAIR',sc,big:0};
return{pts:20,tag:'',sc,big:0}}

let bgOn=true,bgT=0,bgI=0,bgN=null,bgTimer=0;

const CH=[[57,60,64,67],[50,53,57,60],[55,59,62,65],[48,52,55,59]];/* Am7 Dm7 G7 Cmaj7 */
const mf=m=>440*Math.pow(2,(m-69)/12);
function bgTone(m,t,d,ty,v){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=mf(m);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(bgN);o.start(t);o.stop(t+d+.05)}
function bgStep(){if(!bgN)return;const q=60/92/2;while(bgT<ac.currentTime+.4){const b=bgI%32,ch=CH[Math.floor(b/8)],s=b%8;
if(s==0)ch.forEach(n=>bgTone(n,bgT,q*7,'triangle',.018));
if(s%2==0)bgTone(ch[0]-12+(s==4?7:0),bgT,q*1.6,'sine',.06);
if(Math.random()<.55)bgTone(ch[Math.floor(Math.random()*4)]+12+(Math.random()<.3?12:0),bgT,q*1.8,'sine',.03);
bgT+=q;bgI++}}
function bgStart(){if(!bgOn||!snd||bgTimer)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();bgN=ac.createGain();bgN.connect(ac.destination);bgT=ac.currentTime+.1;bgI=0;bgTimer=setInterval(bgStep,120)}catch(e){}}
function bgStop(){clearInterval(bgTimer);bgTimer=0;try{bgN&&bgN.disconnect()}catch(e){}bgN=null}
function bgToggle(){bgOn=!bgOn;try{localStorage.setItem('trc_bgm',bgOn?'1':'0')}catch(e){}bgOn?bgStart():bgStop();render()}
function sndT(b){snd=!snd;b.textContent=snd?'🔊':'🔇';snd?bgStart():bgStop()}

if(!dq){A.innerHTML=bar()+`<h2>⚔️ DICE DUEL ONLINE</h2><div class=card><div class=mut>친구 2명이 각자 폰에서 같은 게임으로 맞붙어요. 먼저 3승하면 승리! 끝나면 다른 게임을 고르며 계속할 수 있어요.</div><div class=sub>게임을 고르면 방이 만들어져요</div><div class=grid>${Object.entries(DG).map(([k,x])=>`<button class=gc onclick="duelNew('${k}')"><span>${x.ic}</span>${x.n}</button>`).join('')}</div><div class=sub style="margin-top:12px">또는 코드로 참가</div><input id=dc inputmode=numeric maxlength=4 placeholder="방 코드 4자리"><button class="btn alt" onclick="duelJoin()">참가하기</button></div>`;return}
const r=dres(),a=dq.mine.rolls,on=dq.opp&&dq.opp.name,f=dg().show;let end='';
if(r.done){const res=r.w>r.l?1:r.w<r.l?-1:0;end=`<div class=huge>${res>0?'WIN':res<0?'LOSE':'DRAW'}</div><div class=sub>다음 게임 고르기</div><div class=grid>${Object.entries(DG).map(([k,x])=>`<button class=gc onclick="duelNext('${k}')"><span>${x.ic}</span>${x.n}</button>`).join('')}</div>`;if(!dq.fin){dq.fin=1;if(res>0)dq.sw.w++;if(res<0)dq.sw.l++;fan(res>0);fx(res>0?100:0,res>0);if(res>0)duelWin()}}
A.innerHTML=bar()+`<div class="card c"><div class=sub>${dg().ic} ${dg().n} · ROOM CODE</div><div class=big>${dq.code}</div><div class=mut>${esc(me)} ⚔️ ${on?esc(dq.opp.name):'상대 대기 중…'} · 시리즈 ${dq.sw.w}:${dq.sw.l}</div><div class=felt>${r.rows.map((x,i)=>`<div class=rw><span class=rk>R${i+1}</span><span class=nm>${f(x[0])} vs ${f(x[1])}</span><b>${x[2]>0?'✅':x[2]<0?'❌':'➖'}</b></div>`).join('')}<div class=sub>${r.w} : ${r.l}</div>${end}${!r.done&&on&&a.length==r.n?(dq.hand?bjUI():'<button class=btn onclick="duelRoll()">'+dg().ic+' GO!</button>'):!r.done&&on?'<div class=mut>상대를 기다리는 중…</div>':''}</div><button class="btn alt" onclick="duelLeave()">나가기</button></div>`}

render();

if(!db){P=lsLoad();try{M=JSON.parse(localStorage.getItem('trc_meta'))||M;M.hof=M.hof||[];M.history=M.history||[]}catch(e){}if(view=='menu')render()}})();
