<script>
const G=[{id:'roulette',n:'ROYAL ROULETTE',ic:'🎡'},{id:'slot',n:'GOLDEN JACKPOT',ic:'🎰'},{id:'bj',n:'BLACKJACK 21',ic:'🃏'},{id:'dice',n:'DICE DUEL',ic:'🎲'},{id:'hl',n:'HIGH & LOW',ic:'⬆️'},{id:'poker',n:'ROYAL POKER',ic:'♠️'}];

function ensureDaily(p){if(!p.daily||p.daily.day!==DAYKEY())p.daily={day:DAYKEY(),solo:0,games:[],duels:0,claims:{}};if(typeof p.daily.solo!=='number')p.daily.solo=0;if(typeof p.daily.duels!=='number')p.daily.duels=0;if(!Array.isArray(p.daily.games))p.daily.games=[];if(!p.daily.claims||typeof p.daily.claims!=='object')p.daily.claims={};return p.daily}
const ACH=[
{id:'first',ic:'🌱',name:'첫 발걸음',desc:'첫 미니게임 플레이',xp:40,ok:p=>(p.plays||0)>=1},

const SU='♠♥♦♣',L=r=>({11:'J',12:'Q',13:'K',14:'A'}[r]||r);

const PN=['하이카드','원페어','투페어','트리플','스트레이트','플러시','풀하우스','포카드','스트레이트 플러시','로열 플러시'],PS=[20,30,45,60,75,80,85,90,95,100];
function ev(h){const rs=h.map(c=>c.r).sort((a,b)=>b-a),fl=h.every(c=>c.s==h[0].s),cn={};rs.forEach(r=>cn[r]=(cn[r]||0)+1);
const q=Object.entries(cn).map(([r,n])=>[n,+r]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]),u=q.length==5;let st=u&&rs[0]-rs[4]==4,hi=rs[0];
if(u&&rs.join()=='14,5,4,3,2'){st=true;hi=5}let k;
if(st&&fl)k=hi==14?9:8;else if(q[0][0]==4)k=7;else if(q[0][0]==3&&q[1][0]==2)k=6;else if(fl)k=5;else if(st)k=4;else if(q[0][0]==3)k=3;else if(q[0][0]==2&&q[1][0]==2)k=2;else if(q[0][0]==2)k=1;else k=0;
return{k,t:st?[k,hi]:[k,...q.map(x=>x[1])]}}

if(!dq){A.innerHTML=bar()+`<h2>🌐 ONLINE DUEL</h2><div class="card c"><div class=champTop><div class=sub>ROYAL CHAMPIONSHIP · ONLINE ONLY</div><div class=huge style="font-size:42px">⚔️ LIVE MATCH</div><div class=big>승리 +3점 · 무승부 0점 · 패배 -3점</div><div class=mut>대회 점수는 온라인 듀얼 경기에서만 반영됩니다.</div></div><div class=mut>친구 2명이 각자 기기에서 같은 게임으로 맞붙어요. 먼저 3승하면 한 게임의 승자가 됩니다. 끝나면 다른 게임을 고르며 시리즈를 이어갈 수 있어요.</div><div class=sub>⚡ 새 온라인 대결 만들기 · 게임 선택</div><div class=grid>${Object.entries(DG).map(([k,x])=>`<button class=gc onclick="duelNew('${k}')"><span>${x.ic}</span>${x.n}</button>`).join('')}</div><div class=sub style="margin-top:12px">🔑 친구에게 받은 방 코드로 참가</div><input id=dc inputmode=numeric maxlength=4 placeholder="방 코드 4자리"><button class="btn alt" onclick="duelJoin()">참가하기</button></div>`;return}
const r=dres(),a=dq.mine.rolls,on=dq.opp&&dq.opp.name,f=dg().show;let end='';
if(r.done){const res=r.w>r.l?1:r.w<r.l?-1:0,points=res>0?3:res<0?-3:0;end=`<div class=huge>${res>0?'WIN':res<0?'LOSE':'DRAW'}</div><div class=champTop><div class=sub>ROYAL CHAMPIONSHIP POINTS</div><div class=champPts>${pointText(points)}점</div><div class=mut>이번 ONLINE DUEL 결과 · 시즌 점수에 반영</div></div><div class=sub>다음 게임을 골라 시리즈를 이어가세요</div><div class=grid>${Object.entries(DG).map(([k,x])=>`<button class=gc onclick="duelNext('${k}')"><span>${x.ic}</span>${x.n}</button>`).join('')}</div>`;if(!dq.fin){dq.fin=1;if(res>0)dq.sw.w++;if(res<0)dq.sw.l++;fan(res>0);fx(res>0?100:0,res>0);if(dq.role==='h'){const hostResult=res>0?0:res<0?1:-1;recordChampionshipMatch([dq.mine.name,dq.opp.name],hostResult).then(()=>{if(view==='duel'&&dq&&dq.fin)vDuel()})}}}
A.innerHTML=bar()+`<div class="card c"><div class=sub>${dg().ic} ${dg().n} · ROOM CODE</div><div class=big>${dq.code}</div><div class=mut>${esc(me)} ⚔️ ${on?esc(dq.opp.name):'상대 대기 중…'} · 시리즈 ${dq.sw.w}:${dq.sw.l}</div><div class=felt>${r.rows.map((x,i)=>`<div class=rw><span class=rk>R${i+1}</span><span class=nm>${f(x[0])} vs ${f(x[1])}</span><b>${x[2]>0?'✅':x[2]<0?'❌':'➖'}</b></div>`).join('')}<div class=sub>${r.w} : ${r.l}</div>${end}${!r.done&&on&&a.length==r.n?(dq.hand?bjUI():'<button class=btn onclick="duelRoll()">'+dg().ic+' GO!</button>'):!r.done&&on?'<div class=mut>상대를 기다리는 중…</div>':''}</div><button class="btn alt" onclick="duelLeave()">나가기</button></div>`}
let onlinePlayersReady=false,onlineMetaReady=false;
function migrateOnlineOnlyScores(){if(!onlinePlayersReady||!onlineMetaReady||M.onlineScoringV1)return;for(const id of Object.keys(P)){const p=P[id];if(!p)continue;if(p.matchLog&&p.matchLog.length)p.localLog=[...(p.localLog||[]),...p.matchLog.map(h=>({at:h.at,opponent:h.opponent,result:h.result}))].slice(-50);p.matchLog=[];p.cp=0;p.cm=0;p.cw=0;p.cd=0;p.cl=0;p.cmt=0;p.cpt=0;p.cwt=0;p.cdt=0;p.clt=0;}M.history=[];M.onlineScoringV1=true;if(db){Promise.all(Object.entries(P).map(([id,p])=>db.collection('players').doc(id).set(p))).then(()=>db.doc('meta/season').set(M)).catch(()=>{lsSave();try{localStorage.setItem('trc_meta',JSON.stringify(M))}catch(e){}})}else{lsSave();try{localStorage.setItem('trc_meta',JSON.stringify(M))}catch(e){}}}

function firebaseConnectionError(e){
  firebaseError = e && e.message ? e.message : String(e || 'Firebase 연결 오류');
  console.error('[THUNDER ROYALE] Firebase:', e);
  if(view==='duel' && db) vDuel();
}
applyTheme();
render();
(async()=>{
  try{
    if(!window.firebase) throw new Error('Firebase SDK를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    auth=firebase.auth();
    try{await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)}catch(e){console.warn('Auth persistence:',e)}
    if(!auth.currentUser) await auth.signInAnonymously();
    db=firebase.firestore();
    functionsApi=firebase.functions();
    authReady=true;
    try{db.settings({ignoreUndefinedProperties:true})}catch(e){}
    db.doc('meta/season').onSnapshot(s=>{
      firebaseError='';
      if(s.exists) M=s.data();
      else{
        try{M=JSON.parse(localStorage.getItem('trc_meta'))||M}catch(e){}
      }
      M.hof=M.hof||[];M.history=M.history||[];
      onlineMetaReady=true;
      migrateOnlineOnlyScores();
      if(!s.exists && M.onlineScoringV1) db.doc('meta/season').set(M).catch(firebaseConnectionError);
      if(['menu','rank','prof','adm','champ','tv'].includes(view))render();
    },firebaseConnectionError);
    db.collection('players').onSnapshot(s=>{
      const localPlayers=lsLoad(),remotePlayers={};
      s.docs.forEach(d=>remotePlayers[d.id]=d.data());
      P={...localPlayers,...remotePlayers};
      onlinePlayersReady=true;
      migrateOnlineOnlyScores();
      const missingIds=Object.keys(localPlayers).filter(id=>!remotePlayers[id]);
      if(missingIds.length){
        Promise.all(missingIds.map(id=>db.collection('players').doc(id).set(P[id])))
          .then(()=>verifyStoredIdentity()).catch(firebaseConnectionError);
      }else{
        verifyStoredIdentity();
      }
      lsSave();
      if(['menu','rank','prof','adm','tv','champ'].includes(view))render();
    },firebaseConnectionError);
  }catch(e){
    firebaseConnectionError(e);
    db=null;
    P=lsLoad();
    try{M=JSON.parse(localStorage.getItem('trc_meta'))||M;M.hof=M.hof||[];M.history=M.history||[]}catch(x){}
    onlinePlayersReady=true;onlineMetaReady=true;
    migrateOnlineOnlyScores();
    if(view==='menu')render();
  }
})();
